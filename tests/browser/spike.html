<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backcast strategy compatibility spike</title>
  <link rel="stylesheet" href="/spike/spike.css">
</head>
<body>
  <main id="workspace" aria-describedby="strategy-help">
    <h1>Strategy compatibility spike</h1>
    <p id="strategy-help">Edit one trusted Python strategy. Execution stays in a dedicated Worker.</p>
    <button id="open" type="button">Open editor</button>
    <button id="load" type="button">Load runtime</button>
    <button id="degrade" type="button">Force degraded editor</button>
    <button id="host-failure" type="button">Force raw copy recovery</button>
    <label id="source-label" for="strategy-source">Python strategy source</label>
    <textarea
      id="strategy-source"
      aria-describedby="strategy-help"
      aria-readonly="true"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      readonly
      spellcheck="false"
    ># Select and copy this recovery source.</textarea>
    <div id="editor-mount" hidden></div>
    <p id="status" role="status" aria-live="polite">Initializing host</p>
    <pre id="output" aria-label="Spike output"></pre>
  </main>
  <script type="module" src="/spike/spike.mjs"></script>
</body>
</html>
