[project]
name = "my-project"
version = "0.1.0"
description = "LLM/Agent development project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "ty>=0.0.58,<0.1",
    "pytest>=8.0",
    "poethepoet>=0.31",
]

# This template repo is not a Python package — pyproject.toml exists to carry
# dev tooling (ruff/ty/pytest/poe). Downstream projects that ship a package
# should add their own [build-system].
[tool.uv]
package = false
# `cloud-run-test` carries cloud-run/main.py's own runtime deps not already
# covered by [project.dependencies] (strawberry-graphql, python-dotenv —
# duckdb/fastapi/uvicorn/httpx are already root runtime deps, shared with
# tickreplay, which cloud-run/main.py now also imports and mounts) so
# tests/test_cloud_run_main.py can import it without a second Python
# environment. It is a default group (not an extra) so a plain `uv run
# pytest` picks it up without an extra flag (a non-default `uv` dependency
# group is NOT installed by a plain `uv run pytest` otherwise).
default-groups = ["cloud-run-test"]

# ============================================================
# ruff
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

# ============================================================
# poethepoet
# ============================================================
[tool.poe.tasks]
lint = "ruff check . && ruff format --check ."
format = "ruff check --fix . && ruff format ."
typecheck = "ty check src/"
test = "pytest -v"
all = ["lint", "typecheck", "test"]

[dependency-groups]
# cloud-run/main.py's own runtime deps, needed only to import and test it
# from the root uv environment (see tests/test_cloud_run_main.py). duckdb is
# already in [project.dependencies] above, so it is not repeated here.
cloud-run-test = [
    "strawberry-graphql>=0.250",
    "python-dotenv>=1.0",
]
